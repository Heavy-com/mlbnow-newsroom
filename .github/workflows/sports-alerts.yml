name: Sports Google Chat Alerts

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  send-alerts:
    runs-on: ubuntu-latest
    steps:
      # continue-on-error so a degraded response from one league never
      # prevents the remaining leagues from running.
      - name: MLB Alerts
        continue-on-error: true
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.ALERTS_SECRET }}" \
            https://heavy-newsroom.vercel.app/api/alerts
          echo ""

      - name: NFL Alerts
        continue-on-error: true
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.ALERTS_SECRET }}" \
            https://heavy-newsroom.vercel.app/api/nfl-alerts
          echo ""

      - name: NBA Alerts
        continue-on-error: true
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.ALERTS_SECRET }}" \
            https://heavy-newsroom.vercel.app/api/nba-alerts
          echo ""

      - name: NHL Alerts
        continue-on-error: true
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.ALERTS_SECRET }}" \
            https://heavy-newsroom.vercel.app/api/nhl-alerts
          echo ""
