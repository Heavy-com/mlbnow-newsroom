name: Sports Google Chat Alerts

# Automatic scheduling is intentionally disabled until alert deduplication is
# persisted outside server memory. Run manually for controlled testing.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  send-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: MLB Alerts
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.ALERTS_SECRET }}" \
            https://heavy-newsroom.vercel.app/api/alerts
          echo ""

      - name: NFL Alerts
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.ALERTS_SECRET }}" \
            https://heavy-newsroom.vercel.app/api/nfl-alerts
          echo ""

      - name: NBA Alerts
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.ALERTS_SECRET }}" \
            https://heavy-newsroom.vercel.app/api/nba-alerts
          echo ""

      - name: NHL Alerts
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.ALERTS_SECRET }}" \
            https://heavy-newsroom.vercel.app/api/nhl-alerts
          echo ""
