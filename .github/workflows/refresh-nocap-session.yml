name: Legacy Nocap Session Refresh (Deprecated)

# The stable Signalizacija bearer token does not require session refreshes.
# Keep this workflow only as a manual fallback while migrating an old
# signalizacija_session cookie stored as NOCAP_SESSION in Vercel.
on:
  workflow_dispatch:

jobs:
  refresh-session:
    runs-on: ubuntu-latest
    steps:
      - name: Login to nocap and get session cookie
        id: login
        run: |
          RESPONSE=$(curl --silent --show-error -c cookies.txt -w "\n%{http_code}" \
            -X POST "https://signal.nocap.lv/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"${{ secrets.NOCAP_USERNAME }}\", \"password\": \"${{ secrets.NOCAP_PASSWORD }}\"}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          echo "Login HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Login failed with status $HTTP_CODE"
            exit 1
          fi

          SESSION=$(grep 'signalizacija_session' cookies.txt | awk '{print $NF}')

          if [ -z "$SESSION" ]; then
            echo "No session cookie found"
            exit 1
          fi

          echo "session=$SESSION" >> "$GITHUB_OUTPUT"

      - name: Get existing Vercel environment variable ID
        id: getenv
        run: |
          RESPONSE=$(curl --silent --show-error \
            "https://api.vercel.com/v9/projects/${{ secrets.VERCEL_PROJECT_ID }}/env" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}")

          ENV_ID=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for env in data.get('envs', []):
              if env.get('key') == 'NOCAP_SESSION':
                  print(env.get('id', ''))
                  break
          ")

          if [ -z "$ENV_ID" ]; then
            echo "NOCAP_SESSION env var not found in Vercel project"
            exit 1
          fi

          echo "env_id=$ENV_ID" >> "$GITHUB_OUTPUT"

      - name: Update NOCAP_SESSION in Vercel
        run: |
          RESPONSE=$(curl --silent --show-error -w "\n%{http_code}" \
            -X PATCH "https://api.vercel.com/v9/projects/${{ secrets.VERCEL_PROJECT_ID }}/env/${{ steps.getenv.outputs.env_id }}" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"value\": \"${{ steps.login.outputs.session }}\", \"target\": [\"production\", \"preview\"]}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "Failed to update Vercel env var (HTTP $HTTP_CODE)"
            exit 1
          fi

          echo "Legacy NOCAP_SESSION updated. Redeploy the project if required."
